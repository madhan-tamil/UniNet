[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uninet"
version = "0.1.0"
description = "AI-Based Detection of Cyber Threats in Unidirectional IP Traffic (SIH26145 - Cosmyx Zero)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "networkx>=3.1",
    "flask>=3.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "rich>=13.0",
]

[project.optional-dependencies]
pcap = ["scapy>=2.5"]
stream = ["kafka-python>=2.0"]
ml = ["torch>=2.2", "torch-geometric>=2.5", "xgboost>=2.0"]
data = ["pandas>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3"]

[project.scripts]
uninet = "uninet.cli:main"
uninet-demo = "uninet.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberate choices for this prototype:
#   BLE001/S110 - graph scorer & PCAP parser fall back rather than crash the pipeline
#   DTZ007      - NetFlow CSV timestamps are genuinely naive local time
#   RUF007      - zip(seq, seq[1:]) is clearer here than itertools.pairwise
#   PERF102     - negligible; dict iteration in a small build loop
ignore = ["BLE001", "S110", "DTZ007", "RUF007", "PERF102"]
