<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UniNet · Threat Console</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo-dot"></span>
    <div>
      <strong>UniNet</strong>
      <span class="sub">Unidirectional Threat Console</span>
    </div>
    <span class="pill ro">read-only</span>
  </div>
  <div class="topbar-right">
    <span id="refreshed" class="muted">—</span>
    <span class="user-chip">{{ user }}</span>
    <a class="btn-ghost" href="{{ url_for('auth.logout') }}">Sign out</a>
  </div>
</header>

<section class="stat-row" id="stat-row">
  <div class="stat"><div class="stat-k" id="s-flows">—</div><div class="stat-l">flows</div></div>
  <div class="stat"><div class="stat-k" id="s-windows">—</div><div class="stat-l">windows</div></div>
  <div class="stat"><div class="stat-k" id="s-graph">—</div><div class="stat-l">TB-graph (nodes / edges)</div></div>
  <div class="stat"><div class="stat-k" id="s-alerts">—</div><div class="stat-l">alerts</div>
    <div class="sev-mini" id="s-sevmini"></div></div>
  <div class="stat grow"><div class="stat-l">threats seen</div><div class="chip-row" id="s-threats"></div></div>
</section>

<main class="layout">
  <section class="panel">
    <div class="panel-head"><h2>Alerts</h2><span class="muted" id="alert-count"></span></div>
    <div id="alert-list" class="alert-list">loading…</div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Detail</h2><span class="muted" id="detail-host"></span></div>
    <div id="detail-empty" class="muted pad">Select an alert to see its evidence and TB-Graph.</div>
    <div id="detail" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="score-bars" id="score-bars"></div>
      <h3>Evidence</h3>
      <div id="evidence" class="evidence"></div>
      <h3>TB-Graph <span class="muted" id="graph-legend">host · burst · domain</span></h3>
      <svg id="graph" viewBox="0 0 520 380" preserveAspectRatio="xMidYMid meet"></svg>
      <p class="muted edge-key">
        <b style="color:#ff9f45">—</b> periodic &nbsp;
        <b style="color:#ff5470">—</b> direction change &nbsp;
        <b style="color:#5b6b93">—</b> other
      </p>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
